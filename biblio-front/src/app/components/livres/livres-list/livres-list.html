
<div class="livres-page">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Liste des livres</h2>

    <a routerLink="/ajout-livre" class="btn btn-primary">
      Ajouter un livre
    </a>
  </div>

  <div *ngIf="chargement" class="alert alert-secondary">
    Chargement des livres...
  </div>

  <div *ngIf="erreur" class="alert alert-danger">
    {{ erreur }}
  </div>
  <div *ngIf="succes" class="alert alert-success" role="status">
    {{ succes }}
  </div>

  <div *ngIf="!chargement && !erreur">
    <p class="text-muted">
      Nombre total de livres : {{ livres.length }}
    </p>

    <section class="filter-panel mb-4">
      <label for="filtre-auteur" class="form-label fw-semibold">Filtrer par auteur</label>
      <div class="d-flex flex-wrap gap-2">
        <select id="filtre-auteur" class="form-select filter-select" [(ngModel)]="auteurId" (ngModelChange)="filtrerParAuteur()">
          <option value="">Tous les auteurs</option>
          <option *ngFor="let auteur of auteurs" [value]="auteur.id">{{ auteur.prenom }} {{ auteur.nom }}</option>
        </select>
        <button *ngIf="auteurId" type="button" class="btn btn-outline-secondary" (click)="auteurId = ''; filtrerParAuteur()">Réinitialiser</button>
      </div>
    </section>

    <div class="table-responsive">
      <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Titre</th>
          <th>ISBN</th>
          <th>Auteur</th>
          <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let livre of livres">
          <td>{{ livre.id }}</td>
          <td>{{ livre.titre }}</td>
          <td>{{ livre.isbn }}</td>

          <td>
            {{ livre.auteur?.prenom }}
            {{ livre.auteur?.nom }}
          </td>

          <td>
            <a
              class="btn btn-warning btn-sm me-2"
              [routerLink]="['/modifier-livre', livre.id]">
              Modifier
            </a>

            <button
              class="btn btn-danger btn-sm"
              (click)="supprimerLivre(livre.id)">
              Supprimer
            </button>
          </td>
        </tr>

        <tr *ngIf="livres.length === 0">
          <td colspan="5" class="text-center">
            <span>Aucun livre trouvé.</span>
            <button *ngIf="auteurId && suppressionAuteurDemandee" type="button" class="btn btn-danger btn-sm ms-2" (click)="supprimerAuteurSansLivres()">
              Supprimer cet auteur maintenant
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
